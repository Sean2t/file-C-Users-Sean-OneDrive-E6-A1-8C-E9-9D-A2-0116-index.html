<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>文化小吃部 - 點餐系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="下載.png" class="banner">
    <h1>文化小吃部</h1>
    <p>地址：臺北市11114陽明山華岡路55號</p>
    <p>電話：2333-4445</p>
</header>

<section class="menu">
    <div class="item">
        <img src="下載 (1).jpg">
        <h3>牛肉麵</h3>
        <p>川味牛肉五塊加上刀切麵</p>
        <span>NT$120</span>
        <button onclick="addToCart('牛肉麵',120)">加入購物車</button>
    </div>

    <div class="item">
        <img src="下載.jpg">
        <h3>牛肉蛋炒飯</h3>
        <p>特製黑胡椒牛肩肉炒飯</p>
        <span>NT$90</span>
        <button onclick="addToCart('牛肉蛋炒飯',90)">加入購物車</button>
    </div>

    <div class="item">
        <img src="下載 (2).jpg">
        <h3>台南滷肉飯</h3>
        <p>傳統台式滷肉飯加上黃瓜片</p>
        <span>NT$50</span>
        <button onclick="addToCart('台南滷肉飯',50)">加入購物車</button>
    </div>

    <div class="item">
        <img src="下載 (3).jpg">
        <h3>頂級陽春麵</h3>
        <p>簡單美味的陽春麵加上一顆鮑魚</p>
        <span>NT$60</span>
        <button onclick="addToCart('頂級陽春麵',60)">加入購物車</button>
    </div>

    <div class="item">
        <img src="下載 (4).jpg">
        <h3>功夫麵</h3>
        <p>用魚肉製作的麵條加上精燉的豬骨湯</p>
        <span>NT$60</span>
        <button onclick="addToCart('功夫麵',60)">加入購物車</button>
    </div>
</section>

<section class="cart">
    <h2>🛒 購物車</h2>
    <ul id="cartList"></ul>
    <p id="total">總金額：NT$0</p>
</section>

<script src="script.js"></script>
</body>
</html>
